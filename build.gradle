plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.neoforge.moddev
}

version = "${libs.versions.minecraft.get()}-${libs.versions.mod.get()}"
group = mod_group_id

base {
    archivesName = mod_id
}

neoForge {
    version = libs.versions.neo.get()

    // TODO: 26.1.2 兼容后恢复 Parchment 映射
    // 需要找到 26.1.2 对应的 Parchment 版本号
    // parchment {
    //     minecraftVersion = libs.versions.minecraft.get()
    //     mappingsVersion  = libs.versions.parchment.get()
    // }
    // ================================================================
    // [TODO-AT] Access Transformer — 26.1.2 兼容后恢复
    // 说明：1.21.1 时有 accesstransformer.cfg（内容为空），26.1.2 需要重新评估
    // 参考文件：src/main/resources/META-INF/accesstransformer.cfg
    // ================================================================
    // accessTransformers {
    //     from 'src/main/resources/META-INF/accesstransformer.cfg'
    // }

    mods {
        register(mod_id) {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        clientData {
            clientData()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }
    }
}


sourceSets.main.resources { srcDir 'src/generated/resources' }

// 确保 main 手工资源优先于 generated DataGen 输出
// （generated 的 blockstates/models 纹理路径错误，不应覆盖 main 的正确版本）
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    // 阿里云镜像（国内加速）
    maven {
        name = "阿里云镜像"
        url = "https://maven.aliyun.com/repository/public"
    }

    mavenCentral()

    // Botania / Patchouli
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }

    // EMI
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    // Geckolib
    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    // Curios
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }

    // Modrinth mods
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    // CurseForge Maven
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ================================================================
    // 26.1.2 依赖状态
    // 已验证可用的依赖（取消注释即可启用）：
    //   compileOnly libs.jei           — JEI 29.6.2.31
    //   localRuntime libs.geckolib      — Geckolib 5.5.1（Ars Nouveau 前置）
    //   localRuntime libs.curios        — Curios 15.0.0-beta.2+26.1.2（Botania 前置）
    //   localRuntime libs.jade          — Jade 26.1.1+neoforge
    //   localRuntime libs.modern.ui     — Modern UI 3.13.0.4
    //   localRuntime libs.jecharacters  — JECharacters 4.6.3
    //
    // 尚无 26.1.2 版本（无法启用）：
    //   ✗ Botania        — 最高 1.20.1（Forge 版）
    //   ✗ Ars Nouveau    — 最高 1.21.1（NeoForge 版）
    //   ✗ Patchouli      — 最低 1.21.1（NeoForge 版，Botania 前置）
    //   ✗ EMI            — 最高 1.21.1（NeoForge 版）
    // ================================================================
    localRuntime libs.jei
    localRuntime libs.curios
    localRuntime libs.jade
    localRuntime libs.modern.ui
    localRuntime libs.jecharacters
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
    var replaceProperties = [
            'mod_id'                    : mod_id,
            'mod_name'                  : mod_name,
            'mod_version'               : libs.versions.mod.get(),
            'mod_authors'               : mod_authors,
            'mod_description'           : mod_description,
            'mod_license'               : mod_license,
            'minecraft_version'         : libs.versions.minecraft.get(),
            'minecraft_version_range'   : minecraft_version_range,
            'neo_version'               : libs.versions.neo.get(),
            'neo_version_range'         : neo_version_range,
            'loader_version_range'      : loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true    }
}


