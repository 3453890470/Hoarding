plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.neoforge.userdev
}

version = "${libs.versions.minecraft.get()}-${libs.versions.mod.get()}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Botania / Patchouli
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    
    // EMI
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    
    // Geckolib
    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    
    // Curios
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    
    // Modrinth mods
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    
    // CurseForge Maven (Jade, Infiniverse, TerraBlender 等)
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    
    // TerraBlender (Botania 世界生成依赖)
    maven {
        name = "ForgeNet"
        url = "https://maven.minecraftforge.net/"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation libs.neoforge

    // 可选依赖 - Botania (编译时)
    compileOnly libs.botania

    // 可选依赖 - Ars Nouveau (编译时)
    compileOnly libs.ars.nouveau

    // === 配方查看器 ===
    // JEI - 仅编译时（兼容性测试）
    compileOnly libs.jei
    
    // EMI - 测试环境运行时
    localRuntime libs.emi

    // === 测试环境 mod (仅运行时) ===
    
    // Botania 依赖
    localRuntime libs.patchouli
    
    // Ars Nouveau 依赖
    localRuntime libs.geckolib
    
    // 通用依赖 - 饰品栏
    localRuntime libs.curios
    
    // 客户端工具 - Jade (方块信息)
    localRuntime libs.jade
    
    // 客户端工具 - Modern UI (Modrinth Maven)
    localRuntime libs.modern.ui
    
    // 客户端工具 - JECharacters (中文搜索)
    localRuntime libs.jecharacters

    // 开发时运行时依赖
    localRuntime libs.botania
    localRuntime libs.ars.nouveau
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            'mod_id'                    : mod_id,
            'mod_name'                  : mod_name,
            'mod_version'               : libs.versions.mod.get(),
            'mod_authors'               : mod_authors,
            'mod_description'           : mod_description,
            'mod_license'               : mod_license,
            'minecraft_version'         : libs.versions.minecraft.get(),
            'minecraft_version_range'   : minecraft_version_range,
            'neo_version'               : libs.versions.neo.get(),
            'neo_version_range'         : neo_version_range,
            'loader_version_range'      : loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
