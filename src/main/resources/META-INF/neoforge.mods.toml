modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/gateguardian/hoarding/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[modproperties.hoarding]
catalogueImageIcon = "logo.png"

[[dependencies.hoarding]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.hoarding]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 可选依赖 - Botania
[[dependencies.hoarding]]
modId = "botania"
type = "optional"
versionRange = "[451,)"
ordering = "AFTER"
side = "BOTH"

# 可选依赖 - Ars Nouveau
[[dependencies.hoarding]]
modId = "ars_nouveau"
type = "optional"
versionRange = "[5.11,)"
ordering = "AFTER"
side = "BOTH"
