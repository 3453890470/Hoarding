plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.neoforge.moddev
}

version = "${libs.versions.minecraft.get()}-${libs.versions.mod.get()}"
group = mod_group_id

base {
    archivesName = mod_id
}

neoForge {
    version = libs.versions.neo.get()

    // TODO: 26.1.2 兼容后恢复 Parchment 映射
    // 需要找到 26.1.2 对应的 Parchment 版本号
    // parchment {
    //     minecraftVersion = libs.versions.minecraft.get()
    //     mappingsVersion  = libs.versions.parchment.get()
    // }
    // ================================================================
    // [TODO-AT] Access Transformer — 26.1.2 兼容后恢复
    // 说明：1.21.1 时有 accesstransformer.cfg（内容为空），26.1.2 需要重新评估
    // 参考文件：src/main/resources/META-INF/accesstransformer.cfg
    // ================================================================
    // accessTransformers {
    //     from 'src/main/resources/META-INF/accesstransformer.cfg'
    // }

    mods {
        register(mod_id) {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
            logLevel = 'DEBUG'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }
    }
}


sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 阿里云镜像（国内加速）
    maven {
        name = "阿里云镜像"
        url = "https://maven.aliyun.com/repository/public"
    }

    mavenCentral()

    // Botania / Patchouli
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }

    // EMI
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    // Geckolib
    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    // Curios
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }

    // Modrinth mods
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    // CurseForge Maven
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ================================================================
    // [TODO-DEPS] 26.1.2 依赖兼容 — 以下依赖在 26.1.2 下暂无对应版本，已注释
    // 恢复步骤：
    //   1. 在 gradle/libs.versions.toml 中找到对应依赖的 TODO 块，填上 26.1.2 兼容版本号
    //   2. 取消下方对应行的注释
    //
    // 各依赖说明：
    //   compileOnly libs.botania        — Botania API，编译引用 → vazkii.botania:botania-neoforge-26.1.2
    //   compileOnly libs.ars.nouveau    — Ars Nouveau API，编译引用 → com.hollingsworth.ars_nouveau:ars_nouveau-26.1.2
    //   compileOnly libs.jei            — JEI API，编译引用 → mezz.jei:jei-26.1.2-neoforge
    //   localRuntime libs.emi           — EMI，测试环境运行时 → dev.emi:emi-neoforge
    //   localRuntime libs.patchouli     — Patchouli，Botania 依赖
    //   localRuntime libs.geckolib      — Geckolib，Ars Nouveau 依赖
    //   localRuntime libs.curios        — Curios，饰品栏
    //   localRuntime libs.jade          — Jade，方块信息
    //   localRuntime libs.modern.ui     — Modern UI
    //   localRuntime libs.jecharacters  — JECharacters 中文搜索
    //   localRuntime libs.botania       — Botania 本体（运行时）
    //   localRuntime libs.ars.nouveau   — Ars Nouveau 本体（运行时）
    // ================================================================
    // compileOnly libs.botania
    // compileOnly libs.ars.nouveau
    // compileOnly libs.jei
    // localRuntime libs.emi
    // localRuntime libs.patchouli
    // localRuntime libs.geckolib
    // localRuntime libs.curios
    // localRuntime libs.jade
    // localRuntime libs.modern.ui
    // localRuntime libs.jecharacters
    // localRuntime libs.botania
    // localRuntime libs.ars.nouveau
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            'mod_id'                    : mod_id,
            'mod_name'                  : mod_name,
            'mod_version'               : libs.versions.mod.get(),
            'mod_authors'               : mod_authors,
            'mod_description'           : mod_description,
            'mod_license'               : mod_license,
            'minecraft_version'         : libs.versions.minecraft.get(),
            'minecraft_version_range'   : minecraft_version_range,
            'neo_version'               : libs.versions.neo.get(),
            'neo_version_range'         : neo_version_range,
            'loader_version_range'      : loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
