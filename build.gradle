plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.165'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Botania / Patchouli
    maven { url = "https://maven.blamejared.com" }
    
    // EMI
    maven { url = "https://maven.terraformersmc.com/" }
    
    // Geckolib
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    
    // Curios
    maven { url = "https://maven.theillusivec4.top/" }
    
    // Modrinth mods
    maven { url = "https://api.modrinth.com/maven" }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // 可选依赖 - Botania (编译时)
    compileOnly "vazkii.botania:botania-neoforge-1.21.1:451-SNAPSHOT"

    // 可选依赖 - Ars Nouveau (编译时)
    compileOnly "com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.11.2.1298"

    // === 测试环境 mod (仅运行时) ===
    
    // 配方查看器 - JEI
    localRuntime "mezz.jei:jei-1.21.1-neoforge:19.21.1.305"
    
    // Botania 依赖 - Patchouli (via Modrinth Maven)
    localRuntime "maven.modrinth:patchouli:1.21.1-92-neoforge"
    
    // Ars Nouveau 依赖
    localRuntime "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.2"
    
    // 通用依赖 - 饰品栏
    localRuntime "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    
    // 客户端工具 - Jade (方块信息)
    localRuntime "maven.modrinth:jade:15.10.5+neoforge"
    
    // 客户端工具 - JECharacters (中文搜索)
    localRuntime "maven.modrinth:I7k4B65h:4.5.23"

    // 开发时运行时依赖（取消注释用于测试）
    // localRuntime "vazkii.botania:botania-neoforge-1.21.1:451-SNAPSHOT"
    // localRuntime "com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.11.2.1298"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            'mod_id'                    : mod_id,
            'mod_name'                  : mod_name,
            'mod_version'               : mod_version,
            'mod_authors'               : mod_authors,
            'mod_description'           : mod_description,
            'mod_license'               : mod_license,
            'minecraft_version'         : minecraft_version,
            'minecraft_version_range'   : minecraft_version_range,
            'neo_version'               : neo_version,
            'neo_version_range'         : neo_version_range,
            'loader_version_range'      : loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
